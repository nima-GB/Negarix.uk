        :root {
            --bg:           #f8f6f2;
            --surface:      #ffffff;
            --surface-warm: #f2efe9;
            --obsidian:     #141514;
            --charcoal:     #262826;
            --gold:         #9a7b42;
            --gold-hover:   #7d6231;
            --gold-light:   rgba(154, 123, 66, 0.22);
            --text:         #1c1e1c;
            --text-muted:   #5e615e;
            --border:       #e4dfd7;
            --error:        #a82020;
            --success:      #1e5e3a;
            --shadow:       0 18px 45px rgba(20, 21, 20, 0.05), 0 1px 3px rgba(20, 21, 20, 0.03);
            --font-serif:   "Georgia", "Times New Roman", Times, serif;
            --font-sans:    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        /* Minimalist Luxury Top Bar */
        .site-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            max-width: 1140px;
            margin: 0 auto;
            padding: 18px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-monogram {
            font-family: var(--font-serif);
            font-size: 0.85rem;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--obsidian);
        }

        .header-locations {
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold);
        }

        /* Main Two-Column Content Area */
        .main-container {
            flex: 1;
            max-width: 1140px;
            width: 100%;
            margin: 0 auto;
            padding: 48px 28px;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 52px;
            align-items: center;
        }

        /* Left Column: Luxury Editorial & Services */
        .company-info {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .eyebrow {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--gold);
            margin-bottom: 12px;
        }

        .hero-title {
            font-family: var(--font-serif);
            font-size: clamp(1.95rem, 3.4vw, 2.65rem);
            font-weight: 400;
            line-height: 1.2;
            color: var(--obsidian);
            letter-spacing: -0.01em;
        }

        .hero-lead {
            margin-top: 16px;
            font-size: 0.98rem;
            color: var(--text-muted);
            max-width: 560px;
            line-height: 1.75;
        }

        .services-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .service-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--gold);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .service-card:hover {
            transform: translateY(-2px);
        }

        .service-card h2 {
            font-family: var(--font-serif);
            font-size: 1.08rem;
            font-weight: 400;
            color: var(--obsidian);
            margin-bottom: 6px;
        }

        .service-card p {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* Right Column: Bespoke Enquiry Card */
        .contact-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-top: 3px solid var(--gold);
            padding: 34px 32px;
            box-shadow: var(--shadow);
        }

        .contact-card h2 {
            font-family: var(--font-serif);
            font-size: 1.35rem;
            font-weight: 400;
            color: var(--obsidian);
            margin-bottom: 6px;
        }

        .contact-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-label {
            font-size: 0.74rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--charcoal);
            display: flex;
            justify-content: space-between;
        }

        .field-input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            background: #faf9f7;
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .field-input:focus {
            background: var(--surface);
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-light);
        }

        textarea.field-input {
            resize: vertical;
            min-height: 96px;
        }

        .char-counter {
            font-size: 0.7rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        .hp-field {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .recaptcha-wrap {
            display: flex;
            justify-content: center;
            margin: 4px 0;
        }

        .form-msg {
            font-size: 0.82rem;
            font-weight: 500;
            min-height: 1.2em;
        }
        .form-msg.error   { color: var(--error); }
        .form-msg.success { color: var(--success); }
        .form-msg.info    { color: var(--text-muted); }
